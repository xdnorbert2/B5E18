<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Új eszközök létrehozása</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container py-5">

        <h1 class="mb-4">Új eszközök létrehozása</h1>

        <form id="eszkozForm">

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Név</label>
                    <input id="nev" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Leltári szám</label>
                    <input id="leltariSzam" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Kategória</label>
                    <input id="kategoria" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Gyártó</label>
                    <input id="gyarto" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Modell</label>
                    <input id="modell" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Terem</label>
                    <input id="terem" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Állapot</label>
                    <input id="allapot" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Beszerzési ár </label>
                    <input id="beszerzesiAr" type="number" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Beszerzés dátuma</label>
                    <input id="beszerzesDatuma" type="date" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <div class="form-check mt-4">
                        <input id="hasznalatbanVan" type="checkbox" class="form-check-input">        
                        <label class="form-check-label">Használatban van</label>                        
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-check mt-4">
                        <input id="kolcsonozheto" type="checkbox" class="form-check-input">        
                        <label class="form-check-label">Kölcsönözhető</label> 
                    </div>                       
                </div>

                <button class="btn btn-warning mt-4" type="submit">Eszköz létrehozása</button>


            </div>

        </form>
        <div id="uzenet" class="mt-3">...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
